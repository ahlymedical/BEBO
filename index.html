<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silence Remover 🎬</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Section 1 -->
  <div class="section">
    <label for="srtFile" class="upload-btn">
      اختر ملف SRT
    </label>
    <input type="file" id="srtFile" accept=".srt,.vtt">
    <div id="fileInfo"></div>
  </div>

  <!-- Section 2 -->
  <div class="section">
    <button id="btnRemove" disabled>✂️ احذف فترات الصمت</button>
    <button id="btnClose" disabled>🔗 اجمع الكليبات جنب بعض</button>
  </div>

  <!-- Section 3 -->
  <div class="section">
    <div id="logArea"></div>
  </div>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
